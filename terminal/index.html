<!DOCTYPE html>
<html>
  <head>
    <title>andrewOS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <script>
      // Static hosts without rewrites still open the same terminal document.
      fetch('/terminal.html')
        .then((response) => response.text())
        .then((html) => {
          document.open();
          document.write(html);
          document.close();
        });
    </script>
  </head>
  <body></body>
</html>
